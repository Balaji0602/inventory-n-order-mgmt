version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: iom_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_NAME:-inventory_order_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - iom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-inventory_order_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iom_backend_api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pass}@postgres:5432/${DB_NAME:-inventory_order_db}
      ENV: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    networks:
      - iom_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iom_frontend_ui
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - iom_network
    restart: always

networks:
  iom_network:
    name: iom_internal_network
    driver: bridge

volumes:
  pgdata_prod:
    name: iom_postgres_data_production
